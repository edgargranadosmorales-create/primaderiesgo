name: Actualizar diferencial diario

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar datos y generar gráfico
        run: python actualizar.py

      - name: Guardar HTML y datos
        run: |
          git config user.name 'dashboard-bot'
          git config user.email 'dashboard-bot@users.noreply.github.com'
          git add index.html data/
          git diff --cached --quiet || (git commit -m 'Actualizar mercado' && git push)
